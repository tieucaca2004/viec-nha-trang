# Staging/Beta stack cho VIỆC NHA TRANG - HOÀN TOÀN TÁCH BIỆT khỏi docker-compose.yml (dev) và
# khỏi bất kỳ project/container/network/volume nào khác trên máy host (vd pshop-music). Không
# dùng chung network, volume, secret hay container với bất kỳ project nào khác.
#
# Kiến trúc: Internet -> Caddy :443/:80 -> backend:3000 (không publish port) -> postgres:5432
# (không publish port, chỉ trong network nội bộ viec-nha-trang-staging-net).
#
# Chạy thủ công trên server thật (KHÔNG chạy trong sandbox này - xem docs/BUILD.md/DEPLOYMENT.md):
#   cp docker-compose.staging.env.example docker-compose.staging.env   # điền mật khẩu DB thật
#   cp apps/backend/.env.staging.example apps/backend/.env.staging     # điền JWT secret thật
#   ./deploy-staging.sh
#
# Biến ${STAGING_DB_*} bên dưới được nội suy từ docker-compose.staging.env (truyền qua cờ
# `--env-file`, KHÔNG export trong shell - tránh lộ mật khẩu vào lịch sử shell). Đây là NGUỒN
# DUY NHẤT cho user/password/tên DB staging - DATABASE_URL của backend được ghép tự động từ
# đúng 3 biến này (xem service "backend" bên dưới), nên không có 2 nơi lưu mật khẩu có thể lệch.
name: viec-nha-trang-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: viec-nha-trang-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:-viecnhatrang}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Thiếu STAGING_DB_PASSWORD - copy docker-compose.staging.env.example sang docker-compose.staging.env rồi điền mật khẩu thật, không dùng mặc định}
      POSTGRES_DB: ${STAGING_DB_NAME:-viec_nha_trang_staging}
    volumes:
      - viec_nha_trang_staging_pg:/var/lib/postgresql/data
    networks:
      - viec-nha-trang-staging-net
    # KHÔNG có "ports:" - không publish ra host, chỉ backend trong cùng network nội bộ mới gọi được.
    healthcheck:
      # Dùng $$POSTGRES_USER/$$POSTGRES_DB (biến MÔI TRƯỜNG THẬT bên trong container postgres,
      # do chính image postgres set ra từ environment: ở trên) thay vì nội suy Compose - tránh
      # phụ thuộc file .env ở thời điểm chạy healthcheck.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: viec-nha-trang-staging-backend
    restart: unless-stopped
    env_file:
      # Chỉ chứa JWT secrets/OTP/throttle/... - KHÔNG chứa DATABASE_URL (xem
      # apps/backend/.env.staging.example - đã bỏ DATABASE_URL khỏi đó).
      - ./apps/backend/.env.staging
    environment:
      # Ghép từ đúng 3 biến STAGING_DB_* ở trên - nguồn duy nhất, không trùng lặp/lệch với
      # bất kỳ DATABASE_URL nào khác có thể còn sót trong .env.staging.
      DATABASE_URL: postgresql://${STAGING_DB_USER:-viecnhatrang}:${STAGING_DB_PASSWORD:?Thiếu STAGING_DB_PASSWORD}@postgres:5432/${STAGING_DB_NAME:-viec_nha_trang_staging}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viec-nha-trang-staging-net
    # KHÔNG có "ports:" - chỉ Caddy trong cùng network gọi được backend:3000, không publish ra host.

  caddy:
    image: caddy:2-alpine
    container_name: viec-nha-trang-staging-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - viec_nha_trang_staging_caddy_data:/data
      - viec_nha_trang_staging_caddy_config:/config
    networks:
      - viec-nha-trang-staging-net
    depends_on:
      - backend

networks:
  viec-nha-trang-staging-net:
    name: viec-nha-trang-staging-net

volumes:
  viec_nha_trang_staging_pg:
    name: viec_nha_trang_staging_pg
  viec_nha_trang_staging_caddy_data:
    name: viec_nha_trang_staging_caddy_data
  viec_nha_trang_staging_caddy_config:
    name: viec_nha_trang_staging_caddy_config
