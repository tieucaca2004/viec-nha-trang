# CI cho VIỆC NHA TRANG - đặc tả docs/PLAN.md §13.
# Chỉ lint/typecheck/build/test trên PR. KHÔNG deploy tự động - chưa có GCP project/credentials
# thật để deploy an toàn (xem docs/DEPLOYMENT.md). Job deploy để lại dưới dạng comment mẫu.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  # Cho phép chạy CI thủ công trên bất kỳ nhánh nào (vd để xác nhận CI thật trước khi mở PR)
  # mà không cần push vào main/master hay tạo PR - không ảnh hưởng trigger tự động ở trên.
  # `staging_api_url` (tuỳ chọn): khi set, build debug APK trỏ tới backend staging đó thay vì
  # localhost mặc định - dùng để build APK Beta test trên thiết bị thật (đặc tả yêu cầu Beta).
  # KHÔNG chứa secret nào ở đây - chỉ là URL public của backend staging.
  workflow_dispatch:
    inputs:
      staging_api_url:
        description: "API_BASE_URL cho build Beta (vd https://staging.example.com/api/v1). Bỏ trống = build thường (localhost), không tạo artifact Beta."
        required: false
        default: ""

jobs:
  backend:
    name: Backend (lint, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viec_nha_trang_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build

      - name: E2E tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/viec_nha_trang_test?schema=public"
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-refresh-secret
          JWT_REFRESH_EXPIRES_IN: 30d
          SMS_PROVIDER: console
          OTP_TTL_SECONDS: "300"
          OTP_MAX_ATTEMPTS: "5"
          OTP_REQUEST_THROTTLE_LIMIT: "1000"
          OTP_VERIFY_THROTTLE_LIMIT: "1000"
          THROTTLE_TTL: "60"
          THROTTLE_LIMIT: "5000"
        run: |
          npx prisma migrate deploy
          npx jest --config ./test/jest-e2e.json --runInBand

  admin:
    name: Admin CMS (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Android SDK có sẵn trên runner ubuntu-latest nên build debug APK chạy được như một smoke
      # test kiến trúc project (Gradle/manifest) - KHÔNG phải release build, không cần signing.
      # Xem docs/BUILD.md - đây là điểm khác với sandbox phát triển (bị chặn dl.google.com).
      - run: flutter build apk --debug

      # Giữ lại chính file APK debug vừa build ở trên làm artifact tải về được, để có 1 file
      # APK thật kiểm chứng được (CI runner không giữ lại file sau khi job kết thúc trừ khi
      # upload artifact) - APK này build với API_BASE_URL mặc định (localhost), CHỈ dùng để xác
      # nhận app build/cài đặt được, KHÔNG dùng để test luồng thật với backend (xem docs/BUILD.md).
      - name: Upload debug APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: viec-nha-trang-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Build APK Beta thứ hai trỏ tới backend staging thật, CHỈ khi người chạy workflow_dispatch
      # cung cấp staging_api_url. Không hard-code URL production - vẫn debug build (chưa có
      # signing config release an toàn), chỉ khác API_BASE_URL/APP_ENV so với build phía trên.
      - name: Build Beta APK (staging API)
        if: github.event_name == 'workflow_dispatch' && inputs.staging_api_url != ''
        # `flutter build apk` (Flutter 3.24.5) không có flag `-o`/`--output` để đổi tên/đường dẫn
        # file - luôn ghi ra đúng build/app/outputs/flutter-apk/app-debug.apk cho debug build.
        # An toàn để build đè lên file cũ ở đây vì bước "Upload debug APK artifact" phía trên đã
        # upload xong bản app-debug.apk (localhost) trước khi bước này chạy - phân biệt 2 bản qua
        # TÊN ARTIFACT khi upload (viec-nha-trang-debug-apk vs viec-nha-trang-beta-debug-apk), không
        # qua tên file.
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL="${{ inputs.staging_api_url }}" \
            --dart-define=DEFAULT_CITY_SLUG=nha-trang

      - name: Upload Beta APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.staging_api_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: viec-nha-trang-beta-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Deploy job MẪU - không chạy tự động (thiếu GCP project/credentials thật trong repo này).
  # Bật bằng cách thêm secrets GCP_PROJECT_ID/GCP_SA_KEY vào repo settings và đổi `if: false`
  # thành điều kiện thật (vd tag release) khi có môi trường production thật - xem docs/DEPLOYMENT.md.
  deploy:
    name: Deploy to Cloud Run (chưa bật)
    runs-on: ubuntu-latest
    needs: [backend, admin]
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "Xem docs/DEPLOYMENT.md - job này cố tình để if:false vì chưa có GCP project thật."
